name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          # The project is developed on Apple silicon; test there too.
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        env:
          EKA_ENVIRONMENT: test
        run: pytest --cov --cov-report=term-missing

  # Real sentence-transformers code path with a tiny model built on the fly
  # (no download). Apple-silicon runner, matching the development machine.
  ml:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ml.lock
      - name: Install with ML extra
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.lock
          pip install -e . --no-deps
      - name: ML tests
        env:
          HF_HUB_OFFLINE: "1"
        run: pytest tests/ml -v
