[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-ai"
version = "0.1.0"
description = "Hybrid-search RAG platform with grounded, citation-verified answers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maksuda Akther Tumpa" }]
dependencies = [
    "fastapi>=0.140,<1.0",
    "uvicorn[standard]>=0.50,<1.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "python-multipart>=0.0.18",      # multipart/form-data uploads (0.0.18+ has DoS fixes)
    "sqlalchemy>=2.0.30,<3.0",
    "pypdf>=6.0,<7.0",               # pure-Python, BSD (PyMuPDF is AGPL; would pull AGPL terms into an MIT project)
    "python-docx>=1.1,<2.0",
    "chromadb>=1.0,<2.0",            # vector store (embedded, persistent, local-first)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx2>=2.13",  # TestClient transport (Starlette 1.x deprecates httpx 0.x)
    "ruff>=0.6",
    "reportlab>=4.0",                # generates multi-page PDF fixtures in tests
]

# Real embedding models (PyTorch). Kept optional so the core test suite and CI
# run without a multi-GB download; tests fall back to the hashing embedder.
ml = [
    "sentence-transformers>=5.0,<7.0",
    "torch>=2.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = [
    "S101",   # assert is fine in tests
    "SIM905", # "a b c".split() is a readable way to write word lists
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"eval/*" = ["S"]
"scripts/*" = ["S"]
# FTS5 table names are interpolated after strict hex validation (table_name());
# every value is a bound parameter.
"app/services/retrieval/keyword.py" = ["S608"]

[tool.coverage.run]
source = ["app"]
